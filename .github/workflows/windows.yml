name: Windows installer
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test windows/tests/*.test.js
      - name: Compile and package
        shell: powershell
        run: ./windows/scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-installer
          path: dist/*.exe
          if-no-files-found: error
      - name: Install, verify the signed device and uninstall on a clean Windows VM
        shell: powershell
        run: ./windows/tests/install.ps1
