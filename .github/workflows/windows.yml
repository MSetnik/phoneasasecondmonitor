name: Windows installer
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node --test windows/tests/*.test.js
      - name: Compile and package
        shell: powershell
        run: |
          try { ./windows/scripts/build.ps1 } catch { Write-Host "::error::$($_.Exception.Message)"; throw }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-installer
          path: dist/*.exe
          if-no-files-found: error
      - name: Install, pair a browser, verify video and uninstall on a clean Windows VM
        timeout-minutes: 5
        env:
          PASM_TEST_DESKTOP: '1'
        shell: powershell
        run: |
          try { ./windows/tests/install.ps1 } catch { Write-Host "::error::$($_.Exception.Message)"; throw }
