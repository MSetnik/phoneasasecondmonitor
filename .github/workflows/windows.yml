name: Windows installer
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'windows/tests/driver-consent.ps1'
      - 'windows/tests/driver-baseline.ps1'
      - 'windows/tests/install.ps1'
      - 'windows/tests/display.cjs'
      - '.github/workflows/test-download.yml'
      - 'README.md'
      - 'web/**'
      - 'windows/website/**'
      - 'windows/scripts/stage-preview.py'
      - 'firebase.windows-preview.json'
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node --test windows/tests/*.test.js
      - name: Exercise video and encrypted input between two browsers
        run: |
          npm ci --prefix windows/tests --ignore-scripts --no-audit --no-fund
          node windows/tests/browser.cjs
      - name: Compile and package
        shell: powershell
        run: |
          try { ./windows/scripts/build.ps1 } catch { Write-Host "::error::$($_.Exception.Message)"; throw }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-installer
          path: dist/*.exe
          if-no-files-found: error
      - name: Install, pair a browser, verify video and uninstall on a clean Windows VM
        timeout-minutes: 5
        env:
          PASM_TEST_DESKTOP: '1'
          PASM_RUNNER_KIND: ${{ runner.environment }}
        shell: powershell
        run: |
          try { ./windows/tests/install.ps1 } catch { Write-Host "::error::$($_.Exception.Message)"; throw }
