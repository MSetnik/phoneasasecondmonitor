name: Windows preview download
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/tests/driver-consent.ps1'
      - 'windows/tests/driver-baseline.ps1'
      - 'windows/tests/install.ps1'
      - 'windows/tests/display.cjs'
      - '.github/workflows/test-download.yml'
permissions:
  contents: read
concurrency:
  group: windows-preview-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install-download:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Download the pinned website candidate
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $name='Phone-as-a-Second-Monitor-Windows-x64-Setup.exe'
          $sha='09b1e4bcb39111a13f22eeb13134e3733e938cd70350d22f4f7fa88d2cdce5d0'
          $url="https://storage.googleapis.com/phone-as-monitor-mcode-downloads/windows/x64/$sha/$name"
          curl.exe --location --fail --silent --show-error $url -o "dist/$name"
          if ($LASTEXITCODE -or (Get-FileHash "dist/$name").Hash -ne $sha) {throw 'Website candidate does not match the pinned installer.'}
      - name: Install and pair the downloaded Windows app
        shell: powershell
        env:
          PASM_TEST_DESKTOP: '1'
          PASM_RUNNER_KIND: ${{ runner.environment }}
        run: |
          try { ./windows/tests/install.ps1 } catch { Write-Host "::error::$($_.Exception.Message)"; throw }
